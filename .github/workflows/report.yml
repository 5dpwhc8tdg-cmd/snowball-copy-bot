name: Недельный отчёт по фильтрам

# Раз в неделю проверяет на накопленных данных: работают ли правила отбора.
# Сравнивает отправленные сигналы с контрольной группой (всё, что нашли, но
# не отправили), считает альфу к рынку, риск просадки и калибровку ожиданий.

on:
  schedule:
    - cron: "0 16 * * 5"      # пятница, 19:00 МСК
  workflow_dispatch:
    inputs:
      days:
        description: "За сколько дней (по умолчанию 7)"
        default: "7"
        required: false
      dry_run:
        description: "Только в лог"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snowball-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Отчёт
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_COMMANDS: "0"
          STATE_BACKEND: json
          STATE_PATH: state/state.json
          MY_CAPITAL: "100000"
          OWNER_CAPITAL: "7000000"
          MY_MAX_POSITION_PCT: "10"
          MY_RESERVE_PCT: "20"
          HOLD_DAYS: "2"
          TZ_NAME: Europe/Moscow
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 bot.py report --days ${{ github.event.inputs.days || '7' }} --dry-run
          else
            python3 bot.py report --days ${{ github.event.inputs.days || '7' }}
          fi
